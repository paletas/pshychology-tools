# CI smoke routing for the wisc3 next image.
# keep in sync with HomeLab roles/htz_server/templates/psychology-next.compose.yml.j2 (labels use $$)
http:
  routers:
    psytoolsnext:
      rule: "Host(`psy.itssilvestre.com`) && (Path(`/new`) || PathPrefix(`/new/`))"
      priority: 100
      entryPoints: [web]
      middlewares: [psytoolsnext-home, psytoolsnext-strip]
      service: psytoolsnext
    psytoolsroot:
      rule: "Host(`psy.itssilvestre.com`)"
      priority: 30
      entryPoints: [web]
      service: psytoolsnext
  middlewares:
    psytoolsnext-home:
      redirectRegex:
        regex: '^(https?://[^/]+)/new/?$'
        replacement: '${1}/new/wisc3'
    psytoolsnext-strip:
      stripPrefix:
        prefixes: ["/new"]
  services:
    psytoolsnext:
      loadBalancer:
        servers:
          - url: http://next:8080
